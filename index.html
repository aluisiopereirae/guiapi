<style>
/* Layout: guia em faixas como os guias de cultivares (Características = âmbar escuro, Manejo = verde), placas hexagonais (favo) que abrem a ficha de cada espécie */
:root{
  --bg:#f5f1e8; --surface:#fffdf8; --surface-2:#efe7d6; --fg:#241c10; --muted:#6f624c; --line:#ddd1b8;
  --amber:#e9a514; --amber-deep:#8a5a06; --amber-soft:#fbefcf; --ink:#2b2114;
  --green:#2f7a3c; --green-deep:#1f5a2b; --green-soft:#e1efdc;
  --red:#b3401d; --red-soft:#f8e1d7; --blue:#2c5d8f; --blue-soft:#dde8f3; --on-strong:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  --sci:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130d; --surface:#211b12; --surface-2:#2b2318; --fg:#f1e9da; --muted:#b5a68b; --line:#3d3325;
  --amber:#f0b429; --amber-deep:#6b4604; --amber-soft:#3a2d12; --ink:#120e08;
  --green:#5cb86a; --green-deep:#1d4a25; --green-soft:#1e3122;
  --red:#ef7a52; --red-soft:#3d2118; --blue:#7fb0e3; --blue-soft:#1b2c3f; --on-strong:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130d; --surface:#211b12; --surface-2:#2b2318; --fg:#f1e9da; --muted:#b5a68b; --line:#3d3325;
  --amber:#f0b429; --amber-deep:#6b4604; --amber-soft:#3a2d12; --ink:#120e08;
  --green:#5cb86a; --green-deep:#1d4a25; --green-soft:#1e3122;
  --red:#ef7a52; --red-soft:#3d2118; --blue:#7fb0e3; --blue-soft:#1b2c3f; --on-strong:#ffffff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--amber-deep)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:var(--amber)}}
:root[data-theme="dark"] a{color:var(--amber)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0}
i.sci,.sci{font-family:var(--sci);font-style:italic;font-weight:500}
.muted{color:var(--muted)}
.ni{color:var(--muted);font-style:italic;font-size:.92em}
.num{font-variant-numeric:tabular-nums}

/* ---------- Cabeçalho ---------- */
.mast{position:relative;overflow:hidden;background:var(--ink);color:#fff;margin-inline:-16px;padding:30px 16px 28px}
.mast::before{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 88% 20%,rgba(233,165,20,.55),transparent 42%),
 linear-gradient(118deg,transparent 0 60%,rgba(47,122,60,.85) 60.2% 100%)}
.mast canvas{position:absolute;right:0;top:0;height:100%;width:52%;opacity:.35;pointer-events:none}
.mast .in{position:relative;max-width:1208px;margin:0 auto;display:flex;flex-wrap:wrap;gap:22px 40px;align-items:flex-end;justify-content:space-between}
.kicker{font-family:var(--display);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:14px;color:#f7d57a}
.mast h1{font-size:clamp(40px,7vw,70px);line-height:.9;font-weight:800;text-transform:uppercase;margin-top:6px}

.mast .sub{margin:12px 0 0;max-width:60ch;opacity:.92}
.hint{display:inline-block;margin-top:14px;border:1px solid rgba(255,255,255,.7);border-radius:6px;padding:4px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:4px 22px}
.stats div{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;opacity:.9}
.stats b{display:block;font-size:40px;line-height:1;letter-spacing:0;color:#f7d57a;font-variant-numeric:tabular-nums}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,auto)}}

/* ---------- Barra de filtros ---------- */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tools input,.tools select{font:inherit;font-size:14px;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.tools input{flex:1 1 220px;min-width:0}
.jump{display:flex;gap:6px;flex-wrap:wrap}
.jump a{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:14px;text-decoration:none;color:var(--fg);border:1.5px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--surface)}
.jump a:hover{border-color:var(--amber)}

/* ---------- Seções ---------- */

.plate{position:relative;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 8px 10px;transition:transform .15s ease,border-color .15s ease}
.plate:hover{transform:translateY(-3px);border-color:var(--amber)}
.hex{width:94px;aspect-ratio:1/1.1547;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--amber);display:grid;place-items:center;max-width:100%}
.hex .in{width:calc(100% - 8px);height:calc(100% - 8px);clip-path:inherit;background:#fff center/cover no-repeat;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--amber-deep);font-size:24px}
.plate .g{font-family:var(--sci);font-style:italic;font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.1;text-align:center}
.plate .e{font-family:var(--sci);font-style:italic;font-weight:600;font-size:17px;line-height:1.1;text-align:center;word-break:break-word}
.plate .p{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:13px;color:var(--amber-deep);text-align:center;margin-top:3px;line-height:1.1}
.plate .no{position:absolute;top:6px;left:8px;font-family:var(--display);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.flag{position:absolute;top:6px;right:6px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 7px;line-height:16px}
.flag.r{background:var(--red-soft);color:var(--red)}
.flag.i{background:var(--blue-soft);color:var(--blue)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .plate .p{color:var(--amber)}}
:root[data-theme="dark"] .plate .p{color:var(--amber)}

/* ---------- Tabela-guia ---------- */
.tablebox{overflow-x:auto;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
table.guide{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.guide th,.guide td{padding:9px 11px;vertical-align:top;border-bottom:1px solid var(--line);font-size:13.5px}
.guide td{width:168px;min-width:168px;max-width:168px}
.guide thead th{background:var(--surface-2);text-align:center;font-weight:400;border-bottom:0}
.guide thead th a{text-decoration:none;color:var(--fg);display:block}
.guide thead .corner{position:sticky;left:0;z-index:3;background:var(--surface-2)}
.guide .band{position:sticky;left:0;z-index:2;width:32px;min-width:32px;padding:0;color:#fff;background:var(--amber-deep)}
.guide .band span{display:block;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;padding:12px 7px;white-space:nowrap}
.guide .band.m{background:var(--green-deep)}

.guide tr.mg th.lab{background:var(--green)}
.guide tr.cz td{background:var(--amber-soft)}
.guide tr.mg td{background:var(--green-soft)}
.guide td strong{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.05}
.guide td small{display:block;color:var(--muted);font-size:12px}
.thname .g{font-family:var(--sci);font-style:italic;font-size:12px;color:var(--muted)}
.thname .e{font-family:var(--sci);font-style:italic;font-weight:600;font-size:16px;display:block}
.thname .hex{width:58px;margin:0 auto 6px}
.pill{display:inline-block;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.03em;text-transform:uppercase;border-radius:999px;padding:1px 9px}

.st.c{color:var(--green)} .st.i{color:var(--blue)} .st.r{color:var(--red)}
.scrollnote{font-size:12px;color:var(--muted);margin:6px 2px 0}
.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}

/* ---------- Painéis ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:36px}
.grid2>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.panel h3{font-size:24px;color:var(--amber-deep);margin-bottom:8px}
.panel.g h3{color:var(--green)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .panel h3{color:var(--amber)}}
:root[data-theme="dark"] .panel h3{color:var(--amber)}
.panel ul{margin:0;padding-left:18px}.panel li{margin:5px 0}
.rev{margin-top:36px}
.rev h3{font-size:28px;margin-bottom:6px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.dt{border-collapse:collapse;width:100%;font-size:13.5px}
.dt th,.dt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.dt thead th{background:var(--ink);color:#fff;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.03em;white-space:nowrap}

/* ---------- Ficha (subguia) ---------- */
.flyer{max-width:960px;margin:0 auto}
.fl-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:16px 12px;align-items:center}
.btn{font-family:var(--display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:15px;border:2px solid var(--amber-deep);color:var(--amber-deep);background:var(--surface);border-radius:999px;padding:6px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--amber-soft)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:var(--amber);border-color:var(--amber)}}
:root[data-theme="dark"] .btn{color:var(--amber);border-color:var(--amber)}
.fl-hero{position:relative;border-radius:18px;overflow:hidden;background:var(--ink);color:#fff}
.fl-hero .hero-in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:stretch}
.fl-hero .photo{position:relative;background:#fff;min-height:260px;display:grid;place-items:center}
.fl-hero .photo img{width:100%;height:100%;object-fit:contain;max-height:380px;display:block}
.fl-hero .photo .ph{font-family:var(--display);font-weight:800;font-size:64px;color:var(--amber-deep)}
.fl-hero .txt{padding:26px 24px;display:flex;flex-direction:column;justify-content:center;gap:6px;background:radial-gradient(120% 90% at 100% 0%,rgba(233,165,20,.35),transparent 60%)}
.fl-hero .no{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:#f7d57a}
.fl-hero h2{font-family:var(--sci);font-style:italic;font-weight:600;font-size:clamp(30px,4.6vw,46px);line-height:1.02}
.fl-hero .auth{font-family:var(--body);font-style:normal;font-size:16px;opacity:.8}
.fl-hero .pop{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;color:#f7d57a;line-height:1.05}
.fl-hero .other{opacity:.85;font-size:14px}
.fl-hero .lead{margin:8px 0 0;opacity:.95;max-width:46ch}
.marquee{background:var(--amber);color:var(--ink);font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:18px;white-space:nowrap;overflow:hidden;padding:6px 0}
.marquee span{display:inline-block;padding-left:12px}
.marquee b{font-weight:500;opacity:.55}
@media (max-width:720px){.fl-hero .hero-in{grid-template-columns:1fr}}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}
.badge{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--amber);border-radius:14px;padding:8px 12px 8px 8px;line-height:1.15}
.badge .hx{flex:none;width:36px;aspect-ratio:1/1.1547;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--amber);display:grid;place-items:center;color:var(--ink)}
.badge .hx svg{width:18px;height:18px}
.badge small{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;color:var(--muted)}
.badge b{font-family:var(--display);font-size:17px;font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin-top:28px}
.two>*{min-width:0}
.sec-t{font-size:26px;color:var(--amber-deep);font-weight:700;margin-bottom:10px;padding-bottom:4px;border-bottom:3px solid var(--amber);display:inline-block}
.sec-t.g{color:var(--green);border-bottom-color:var(--green)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sec-t:not(.g){color:var(--amber)}}
:root[data-theme="dark"] .sec-t:not(.g){color:var(--amber)}
.kv{display:grid;gap:7px}
.kv .row{display:grid;grid-template-columns:minmax(110px,38%) 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.kv .k{background:var(--amber-deep);color:#fff;font-family:var(--display);font-weight:600;font-size:15px;padding:7px 10px;display:flex;align-items:center}

.bio p{margin:0 0 12px}

.stbig{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:14px;border-radius:999px;padding:3px 12px}
.stbig.c{background:var(--green);color:#fff}.stbig.i{background:var(--blue);color:#fff}.stbig.r{background:var(--red);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13.5px;background:var(--surface-2)}
.chip.pl{border-color:var(--green);background:var(--green-soft)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.gal figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.gal button{all:unset;cursor:zoom-in;display:block;background:#fff;aspect-ratio:4/3}
.gal button:focus-visible{outline:3px solid var(--amber);outline-offset:-3px}
.gal img{width:100%;height:100%;object-fit:contain;display:block}

.callout.warn{border-color:var(--red)}.callout.warn h4{background:var(--red)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px}

@media (max-width:520px){.kv .row{grid-template-columns:1fr}.plates{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}.hex{width:80px}}

<script src="data.js" charset="utf-8"></script>
<script src="imgs.js" charset="utf-8"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const NI = '<span class="ni">não informado</span>';
const slugOf = x => x.dup ? "ptilotrigona-heideri" : (x.g+"-"+x.e).toLowerCase();
const imgKey = x => (x.g+"-"+x.e).toLowerCase();
const imgsOf = x => x.dup ? [] : (IMGS[imgKey(x)]||[]);
const cover = x => { const L=imgsOf(x).filter(i=>!/ficha/.test(i.f)); return L.length? "img/"+L[0].f : null; };
const byN = [...SP].sort((a,b)=>a.n-b.n);
const STL = {c:"Registro confirmado",i:"Registro de identidade incerta",r:"Revisar: não confirmado"};
const MANL = {Sim:["sim","Manejável"],"Não":["nao","Não manejável"],"Chão":["chao","Ninho no chão"]};
const initials = x => x.g[0]+x.e[0];

function hex(x,cls=""){
  const c=cover(x);
  return `<div class="hex ${cls}"><div class="in" ${c?`style="background-image:url('${c}')"`:''}>${c?'':initials(x).toUpperCase()}</div></div>`;
}
function plate(x){
  const f = x.ma.s==="r"?'<span class="flag r">Revisar</span>':x.ma.s==="i"?'<span class="flag i">Incerta</span>':'';
  return `<a class="plate" href="#${slugOf(x)}" data-q="${esc((x.g+' '+x.e+' '+x.pop+' '+(x.outros||[]).join(' ')+' '+(x.lista||'')).toLowerCase())}" aria-label="Abrir ficha de ${esc(x.g+' '+x.e)}, ${esc(x.pop)}">
   <span class="no">nº ${x.n}</span>${f}${hex(x)}

}

function drawComb(){
  const c=$("#comb"); if(!c) return; const r=c.getBoundingClientRect(); const d=window.devicePixelRatio||1;
  c.width=r.width*d; c.height=r.height*d; const g=c.getContext("2d"); g.scale(d,d);
  const s=22, w=Math.sqrt(3)*s; g.strokeStyle="rgba(247,213,122,.9)"; g.lineWidth=1.2;
  for(let row=-1; row*s*1.5<r.height+s; row++) for(let col=-1; col*w<r.width+w; col++){
    const cx=col*w+(row%2?w/2:0), cy=row*s*1.5; g.beginPath();
    for(let k=0;k<6;k++){const a=Math.PI/3*k+Math.PI/6; const px=cx+s*Math.cos(a), py=cy+s*Math.sin(a); k?g.lineTo(px,py):g.moveTo(px,py);} g.closePath(); g.stroke();
  }
}

function manejoTips(x){
  const t=[];
  if(x.grp==="limao") t.push("Abelha-ladra (cleptobiótica): não coleta alimento em flores e saqueia ninhos de outras abelhas. Mantenha colônias fortes e entradas estreitas nos meliponários próximos.");
  if(x.g==="Oxytrigona") t.push("Defende o ninho com secreção cáustica que provoca queimaduras na pele. Use proteção e evite abrir o ninho.");
  if(x.man==="Não") t.push("Classificada como não manejável na lista. Não é indicada para criação racional; conserve os ninhos em campo.");
  if(x.man==="Chão") t.push("Ninho subterrâneo, em cavidades no solo. A lista a classifica como \"Chão\": não se adapta ao manejo usual em caixas.");
  if(x.ficha && /defensiv|agressiv/i.test(x.ficha.asp)) t.push("Operárias defensivas: aproxime-se do ninho com cuidado e em horários de menor atividade.");
  if(x.ficha && /mansa/i.test(x.ficha.asp)) t.push("As fichas descrevem as operárias como mansas.");
  if(x.ma.s!=="c") t.push("Antes de criar ou multiplicar, confirme a identificação com um especialista: o registro no Maranhão está marcado para revisão.");
  if(x.man!=="Não" && x.grp!=="limao") t.push("Crie apenas dentro da área de ocorrência natural (Portaria ICMBio 665/2021). Até 49 colônias sem fins econômicos dispensam autorização (CONAMA 496/2020).");
  return t;
}

   <p class="foot">Guia de abelhas sem ferrão do Maranhão · 09/2026. Imagens com os créditos indicados; as marcadas "autoria a confirmar" precisam de crédito antes da divulgação.</p>
  </article>`;
  document.querySelectorAll(".gal button").forEach(b=>b.addEventListener("click",()=>{const m=IM[+b.dataset.k]; $("#lbimg").src="img/"+m.f; $("#lbimg").alt=m.k; $("#lbcap").textContent=m.k+" · "+m.c; $("#lb").hidden=false; $("#lbx").focus();}));
  window.scrollTo(0,0);
}
$("#lbx").addEventListener("click",()=>{$("#lb").hidden=true});
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")$("#lb").hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#lb").hidden=true});

let onGuide=false;
function route(){
  const h=location.hash.slice(1); const x=SP.find(s=>slugOf(s)===h);
  if(x){onGuide=false; return renderSpecies(x);}
  if(!onGuide){renderGuide(); onGuide=true;}
  if(h){const el=document.getElementById(h); if(el) el.scrollIntoView();} else window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
window.addEventListener("resize",()=>{if(onGuide)drawComb()});
route();
</script>
